services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatdidimiss
      POSTGRES_PASSWORD: whatdidimiss
      POSTGRES_DB: whatdidimiss
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatdidimiss -d whatdidimiss"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://whatdidimiss:whatdidimiss@db:5432/whatdidimiss
      DIRECT_URL: postgresql://whatdidimiss:whatdidimiss@db:5432/whatdidimiss
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  db_data:
